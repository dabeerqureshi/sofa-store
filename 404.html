<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Canadian Sofa Co.</title>
<meta name="robots" content="noindex, nofollow">
<!-- Auto-redirect (no-JS fallback). Relative so it works under /sofa-store/
     today and under a custom domain later. -->
<meta http-equiv="refresh" content="0; url=index.html">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #16243a; color: #f5f7fa; font: 500 1rem/1.6 Inter, system-ui, sans-serif;
    padding: 1.5rem; text-align: center;
  }
  .card { max-width: 30rem; }
  a { color: #c9a66b; }
</style>
</head>
<body>
  <main class="card">
    <h1>That page isn't here.</h1>
    <p>We couldn't find what you were looking for — you'll be sent back to the
       homepage in a moment. If you weren't redirected automatically,
       <a href="index.html">go to the homepage</a> or
       <a href="catalog.html">browse the catalogue</a>.</p>
  </main>
  <script>
    // Redirect to the homepage with JS (more reliable than the meta refresh).
    // Using location.replace() keeps the broken URL out of history.
    try { window.location.replace('index.html'); } catch (e) {}
  </script>
</body>
</html>
